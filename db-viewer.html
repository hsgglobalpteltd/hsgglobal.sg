<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iB local D1 SQLite Database Viewer</title>
  
  <!-- Font Awesome & Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-base: #090d16;
      --bg-surface: #131926;
      --bg-hover: #1e2638;
      --border-color: #27314a;
      
      --accent-color: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.15);
      --accent-hover: #60a5fa;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dark: #64748b;
      
      --danger-color: #ef4444;
      --success-color: #10b981;
      
      --font-family: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      height: 64px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: white;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger-color);
      box-shadow: 0 0 8px var(--danger-color);
      transition: all 0.3s;
    }

    .status-dot.connected {
      background-color: var(--success-color);
      box-shadow: 0 0 8px var(--success-color);
    }

    /* Main Container layout */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: 280px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(39, 49, 74, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .btn-refresh-list {
      background: none;
      border: none;
      color: var(--text-dark);
      cursor: pointer;
      font-size: 13px;
      transition: color 0.2s;
    }

    .btn-refresh-list:hover {
      color: var(--text-main);
    }

    .table-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .table-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text-muted);
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .table-item:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .table-item.active {
      background-color: var(--accent-glow);
      border-color: var(--accent-color);
      color: var(--text-main);
      font-weight: 600;
    }

    .table-item-icon {
      font-size: 14px;
      color: var(--text-dark);
    }

    .table-item.active .table-item-icon {
      color: var(--accent-color);
    }

    /* Main Content view */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-base);
      overflow: hidden;
      padding: 20px;
    }

    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .welcome-icon {
      font-size: 64px;
      color: var(--border-color);
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.7; }
    }

    .welcome-screen h3 {
      color: var(--text-main);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* Data Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 16px;
      flex-shrink: 0;
    }

    .table-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .table-info h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .row-count-badge {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-hover);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
      width: 260px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dark);
      font-size: 13px;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 16px 0 36px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 13px;
      font-family: var(--font-family);
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn {
      height: 38px;
      padding: 0 16px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-family);
      transition: all 0.2s;
    }

    .btn:hover {
      background-color: var(--bg-hover);
      border-color: var(--text-dark);
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: none;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      transform: translateY(-1px);
    }

    /* Data Grid table wrapper */
    .data-grid-container {
      flex: 1;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: auto;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    .data-table th {
      background-color: #0f1522;
      position: sticky;
      top: 0;
      padding: 14px 18px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border-color);
      z-index: 2;
      font-family: var(--font-family);
      white-space: nowrap;
    }

    .data-table td {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(39, 49, 74, 0.4);
      color: var(--text-main);
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }

    .data-table tr:hover td {
      background-color: rgba(255, 255, 255, 0.015);
    }

    /* Null representation */
    .null-val {
      color: #df8e3d;
      font-style: italic;
      font-size: 11px;
    }

    .empty-val {
      color: var(--text-dark);
      font-style: italic;
      font-size: 11px;
    }

    .loader {
      position: absolute;
      inset: 0;
      background-color: rgba(9, 13, 22, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      gap: 12px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(59, 130, 246, 0.1);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-dark);
    }
  </style>
</head>
<body>

  <!-- Top Header bar -->
  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-database"></i></div>
      <div class="brand-title">iB local D1 SQLite Database Viewer</div>
    </div>
    
    <div class="connection-status">
      <span class="status-dot" id="status-indicator"></span>
      <span id="status-label">Offline</span>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar for tables listing -->
    <aside>
      <div class="sidebar-header">
        <h2>Tables</h2>
        <button class="btn-refresh-list" id="btn-refresh-tables" title="Refresh Table List">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
      <div class="table-list" id="table-list-container">
        <!-- Tables will load dynamically here -->
      </div>
    </aside>

    <!-- Main Table viewer panel -->
    <main>
      <!-- Welcome Screen when no table is active -->
      <div class="welcome-screen" id="welcome-view">
        <div class="welcome-icon"><i class="fa-solid fa-server"></i></div>
        <h3>Select a Database Table</h3>
        <p>Choose an SQLite table from the sidebar list to inspect schemas, columns, and raw rows instantly.</p>
      </div>

      <!-- Main Viewer Screen -->
      <div id="viewer-view" style="display: none; flex-direction: column; flex: 1; overflow: hidden;">
        <div class="toolbar">
          <div class="table-info">
            <h2 id="active-table-title">tenants</h2>
            <span class="row-count-badge" id="row-count-badge">0 rows</span>
          </div>
          
          <div class="toolbar-actions">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" class="search-input" id="search-input" placeholder="Search rows in view...">
            </div>
            <button class="btn" id="btn-refresh-data"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
          </div>
        </div>

        <div class="data-grid-container">
          <!-- Loading overlay -->
          <div class="loader" id="data-loader" style="display: none;">
            <div class="spinner"></div>
            <p>Querying SQLite table...</p>
          </div>
          
          <table class="data-table" id="db-data-table">
            <thead>
              <!-- Headers will inject dynamically -->
            </thead>
            <tbody>
              <!-- Rows will inject dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Local API mapping automatically
    const getLocalWorkerUrl = () => {
      const hostname = window.location.hostname;
      const isLocal = 
        hostname === "localhost" || 
        hostname === "127.0.0.1" ||
        hostname.startsWith("192.168.") ||
        hostname.startsWith("10.") ||
        hostname.startsWith("172.");
      if (!isLocal) return "http://127.0.0.1:8787"; // fallback if file:///
      const targetHost = hostname === "localhost" ? "127.0.0.1" : hostname;
      return `http://${targetHost}:8787`;
    };

    const API_BASE = getLocalWorkerUrl(); 
    
    let activeTable = null;
    let rawTableRows = [];

    // Elements
    const statusIndicator = document.getElementById("status-indicator");
    const statusLabel = document.getElementById("status-label");
    const tableListContainer = document.getElementById("table-list-container");
    const welcomeView = document.getElementById("welcome-view");
    const viewerView = document.getElementById("viewer-view");
    const activeTableTitle = document.getElementById("active-table-title");
    const rowCountBadge = document.getElementById("row-count-badge");
    const dataLoader = document.getElementById("data-loader");
    const dbDataTable = document.getElementById("db-data-table");
    const searchInput = document.getElementById("search-input");
    
    // Check connection health
    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/api/health`);
        if (res.ok) {
          statusIndicator.className = "status-dot connected";
          statusLabel.innerText = "Local D1 Connected";
          return true;
        }
      } catch (e) {}
      statusIndicator.className = "status-dot";
      statusLabel.innerText = "Offline: Check npx wrangler dev";
      return false;
    }

    // Load tables list
    async function loadTables() {
      const isOk = await checkHealth();
      if (!isOk) {
        tableListContainer.innerHTML = `
          <div style="padding: 20px; text-align: center; color: var(--text-dark); font-size:12px;">
            <i class="fa-solid fa-circle-exclamation" style="font-size:24px; margin-bottom:10px; display:block;"></i>
            Cannot reach local worker.<br>Run <code>npx wrangler dev</code> in backend first.
          </div>
        `;
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/admin/db/tables`);
        if (!res.ok) throw new Error();
        const tables = await res.json();
        
        tableListContainer.innerHTML = "";
        if (tables.length === 0) {
          tableListContainer.innerHTML = `<p style="padding: 20px; text-align: center; color: var(--text-dark);">No tables in D1 database.</p>`;
          return;
        }
        
        tables.forEach(tableName => {
          const item = document.createElement("a");
          item.className = `table-item ${activeTable === tableName ? 'active' : ''}`;
          item.innerHTML = `
            <i class="fa-solid fa-table table-item-icon"></i>
            <span>${tableName}</span>
          `;
          item.addEventListener("click", (e) => {
            e.preventDefault();
            selectTable(tableName);
          });
          tableListContainer.appendChild(item);
        });
      } catch (e) {
        tableListContainer.innerHTML = `<p style="padding: 20px; color: var(--danger-color); text-align: center;">Error loading tables list.</p>`;
      }
    }

    // Load table details
    async function selectTable(tableName) {
      activeTable = tableName;
      
      // Update sidebar active states
      document.querySelectorAll(".table-item").forEach(item => {
        if (item.querySelector("span").innerText === tableName) {
          item.classList.add("active");
        } else {
          item.classList.remove("active");
        }
      });
      
      // Transition views
      welcomeView.style.display = "none";
      viewerView.style.display = "flex";
      activeTableTitle.innerText = tableName;
      
      await loadTableData(tableName);
    }

    // Fetch and render SQLite table data
    async function loadTableData(tableName) {
      dataLoader.style.display = "flex";
      searchInput.value = "";
      
      try {
        const res = await fetch(`${API_BASE}/api/admin/db/table-data?table=${tableName}`);
        if (!res.ok) throw new Error("Failed to load table rows");
        rawTableRows = await res.json();
        
        rowCountBadge.innerText = `${rawTableRows.length} rows`;
        renderTableRows(rawTableRows);
      } catch (e) {
        dbDataTable.querySelector("thead").innerHTML = "";
        dbDataTable.querySelector("tbody").innerHTML = `
          <tr>
            <td style="color: var(--danger-color); text-align: center; padding: 40px; font-family:var(--font-family);">
              <i class="fa-solid fa-triangle-exclamation" style="font-size:24px; margin-bottom:10px; display:block;"></i>
              Failed to query data from D1 table: ${e.message}
            </td>
          </tr>
        `;
        rowCountBadge.innerText = "Error";
      } finally {
        dataLoader.style.display = "none";
      }
    }

    // Render columns and rows dynamically
    function renderTableRows(rows) {
      const thead = dbDataTable.querySelector("thead");
      const tbody = dbDataTable.querySelector("tbody");
      
      thead.innerHTML = "";
      tbody.innerHTML = "";
      
      if (rows.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td style="text-align: center; padding: 40px; color: var(--text-dark); font-family:var(--font-family);">
              <i class="fa-solid fa-folder-minus" style="font-size: 24px; margin-bottom:10px; display:block;"></i>
              This table is currently empty.
            </td>
          </tr>
        `;
        return;
      }
      
      // 1. Identify columns dynamically from the first record keys
      const columns = Object.keys(rows[0]);
      
      // 2. Build headers
      const trHeader = document.createElement("tr");
      columns.forEach(col => {
        const th = document.createElement("th");
        th.innerText = col;
        trHeader.appendChild(th);
      });
      thead.appendChild(trHeader);
      
      // 3. Build data rows
      rows.forEach(row => {
        const trRow = document.createElement("tr");
        columns.forEach(col => {
          const td = document.createElement("td");
          const val = row[col];
          
          if (val === null || val === undefined) {
            td.innerHTML = `<span class="null-val">null</span>`;
          } else if (val === "") {
            td.innerHTML = `<span class="empty-val">empty</span>`;
          } else {
            td.innerText = String(val);
          }
          
          trRow.appendChild(td);
        });
        tbody.appendChild(trRow);
      });
    }

    // Client-side quick filter
    searchInput.addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        renderTableRows(rawTableRows);
        return;
      }
      
      const filtered = rawTableRows.filter(row => {
        return Object.values(row).some(val => 
          String(val).toLowerCase().includes(query)
        );
      });
      
      renderTableRows(filtered);
    });

    // Bind event buttons
    document.getElementById("btn-refresh-tables").addEventListener("click", loadTables);
    document.getElementById("btn-refresh-data").addEventListener("click", () => {
      if (activeTable) loadTableData(activeTable);
    });

    // Initial load
    loadTables();
  </script>
</body>
</html>
