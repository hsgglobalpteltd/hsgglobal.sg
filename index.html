<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iB - HSG Global Sites</title>
  <!-- GrapesJS CDN CSS -->
  <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" id="dynamic-favicon">
  <!-- Local Styles -->
  <link rel="stylesheet" href="/index.css">
  
  <!-- Dynamic Route Background Detector to eliminate white flash/flicker -->
  <script>
    (function() {
      const path = window.location.pathname.replace(/^\/|\/$/g, "");
      const isPublic = path !== "login" && path !== "dashboard";
      
      const style = document.createElement("style");
      style.innerHTML = isPublic 
        ? "body { background-color: #ffffff !important; } #app-loader { background-color: #ffffff !important; }" 
        : "body { background-color: #F6F8FC !important; } #app-loader { background-color: #F6F8FC !important; }";
      document.head.appendChild(style);
    })();
  </script>
</head>
<body>
  <div id="app">
    <div id="app-loader" style="display:flex; flex-direction:column; height:100vh; width:100vw; align-items:center; justify-content:center; box-sizing:border-box;">
      <div style="width: 32px; height: 32px; border: 4px solid rgba(24,24,27,0.1); border-left-color: #18181B; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    </div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </div>

  <!-- GrapesJS CDN JS -->
  <script src="https://unpkg.com/grapesjs"></script>
  <!-- Main Logic -->
  <script type="module" src="/index.js"></script>
</body>
</html>
