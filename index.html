<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iB - HSG Global Sites</title>
  <!-- Fast API Preconnect -->
  <link rel="preconnect" href="https://ib-v2.hsgglobalpteltd.workers.dev">
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" id="dynamic-favicon">
  <!-- Local Styles -->
  <link rel="stylesheet" href="/index.css">
  
  <!-- Dynamic Route Background Detector to eliminate white flash/flicker -->
  <script>
    (function() {
      const path = window.location.pathname.replace(/^\/|\/$/g, "");
      const isPublic = path !== "login" && path !== "dashboard";
      
      const style = document.createElement("style");
      style.innerHTML = isPublic 
        ? "body { background-color: #ffffff !important; }" 
        : "body { background-color: #F6F8FC !important; }";
      document.head.appendChild(style);
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- Main Logic (GrapesJS is lazy loaded only when opening the builder) -->
  <script type="module" src="/index.js"></script>
</body>
</html>
